name: Build AniGooli APKs

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare optional release keystore
        id: keystore
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
        run: |
          if [ -n "$KEYSTORE_CONTENT" ]; then
            echo "$KEYSTORE_CONTENT" | base64 -d > "${{ github.workspace }}/release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug & Release APKs
        env:
          ORG_GRADLE_PROJECT_storeFilePath: ${{ steps.keystore.outputs.has_keystore == 'true' && format('{0}/release.jks', github.workspace) || '' }}
          ORG_GRADLE_PROJECT_storePass: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_key: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPass: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anigooli-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: anigooli-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
