name: Release AniGooli

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare optional release keystore
        id: keystore
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
        run: |
          if [ -n "$KEYSTORE_CONTENT" ]; then
            echo "$KEYSTORE_CONTENT" | base64 -d > "${{ github.workspace }}/release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests & Build Release APK
        env:
          ORG_GRADLE_PROJECT_storeFilePath: ${{ steps.keystore.outputs.has_keystore == 'true' && format('{0}/release.jks', github.workspace) || '' }}
          ORG_GRADLE_PROJECT_storePass: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_key: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPass: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Release APK
        id: apk
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          mkdir -p dist
          APK_SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_SRC" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          APK_DST="dist/AniGooli-${TAG}.apk"
          cp "$APK_SRC" "$APK_DST"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "path=${APK_DST}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: AniGooli ${{ steps.apk.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
